# =============================================================
#  Animal Recognition — Pipeline Configuration
#  Change values here to swap models or tune hyperparameters.
#  No code changes needed to switch between classifiers.
#
#  The values below are the ones reported in the final report and are what
#  inference.py runs with out of the box:
#    detector    yolov8x-worldv2 @ 0.05, restricted to the 7 accept prompts
#    classifier  GCViT-tiny, BitFit (bias + norm tuning), peak LR 1e-3
#    ood gate    implemented but disabled (the detector does the rejecting)
#
#  IMPLEMENTED OPTIONS:
#    detector:   yoloworld     (src/models/yoloworld.py — open vocabulary, deployed)
#                yolov8m       (src/models/detector.py — closed vocabulary, superseded)
#    classifier: gcvit         (src/models/classifier_gcvit.py)
#                convnext      (src/models/classifier_convnext.py)
#    ood_gate:   softmax_threshold | energy | temperature_scaling  (src/ood/gate.py)
#    xai:        gradcam_xai | occlusion_xai  (src/xai/)
# =============================================================

# -------------------------------------------------------------
# Pipeline routing
# -------------------------------------------------------------
pipeline:
  # 'yoloworld' (deployed) | 'yolov8m' (closed-vocabulary, kept for reference)
  detector: yoloworld

  # 'gcvit' | 'convnext' — must match the architecture the weights were trained with
  classifier: gcvit

  # Which gate to use *when* ood.enabled is true. See the ood block below.
  ood_gate: energy

# -------------------------------------------------------------
# Detector settings (src/models/yoloworld.py)
# -------------------------------------------------------------
detector:
  model: yolov8x-worldv2.pt     # s/m/l/x available; x has the best precision

  # 0.05 sits at the knee of the recall/precision curve: recall 98.1%,
  # precision 96.2% on the provided validation set.
  confidence_threshold: 0.05

  # Restrict the open vocabulary to its *accept* half at inference time.
  # The reject prompts are not used for inference
  restrict_to_accept_prompts: true
  reject_on_invalid_class: true

# -------------------------------------------------------------
# Classifier settings
# -------------------------------------------------------------
classifier:
  num_classes: 20               # 20 breeds — reject is not an output node

  # timm backbone name; must match the checkpoint below.
  backbone: gcvit_tiny

  # Path to the .pt checkpoint, relative to this file (absolute also works).
  # Best tiny run (By accuracy and F1): BitFit (biases + norms + head, 0.85% of parameters)
  weights: animal_recognition/models/weights/Initial_Experiments/gcvit_tiny_gcvit_tiny_bitfit_preTrue_bs32_lr0.0001_wd0_ls0.0_sz224_augstronger_schedCosineLRScheduler.pt

  image_size: 224               # crop is padded/resized to this before the classifier

# -------------------------------------------------------------
# OOD gate
# -------------------------------------------------------------
ood:
  # Disabled: the detector already rejects 36 of 40 confounders on the
  # provided set, and the gate thresholds were tuned on only 143 images.
  # Set to true to put the gate back in front of the classifier's argmax.
  enabled: false

  # softmax_threshold: reject if max(softmax(logits)) < threshold  (higher = more rejections)
  # energy:            reject if energy score > threshold           (lower = more rejections)
  threshold: -3.9
  temperature: 1.0      # T for energy/temperature_scaling: divides logits before softmax

# -------------------------------------------------------------
# Training
# -------------------------------------------------------------
training:
  seed: 42
  epochs: 25            # total epochs for baseline_cnn; ignored for transfer (uses phases below)
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 4

  # Three-phase fine-tuning (transfer only — used by trainer.py)
  phase1_epochs: 5      # freeze backbone, train head only at lr
  phase2_epochs: 10     # unfreeze last 2 backbone blocks, lr / 10
  phase3_epochs: 10     # unfreeze full network, cosine annealing to 0

# -------------------------------------------------------------
# Data
# -------------------------------------------------------------
data:
  raw_dir: animal_recognition/data/raw
  processed_dir: animal_recognition/data/processed    # cropped/accepted images (YoloWorld preprocessing)
  confounders_dir: animal_recognition/data/confounders
  val_split: 0.2        # fraction of raw data held out for validation
  image_size: 224       # classifier input size and detector crop resize target
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet mean — used by xAI scripts
  normalize_std: [0.229, 0.224, 0.225]    # ImageNet std  — used by xAI scripts

# -------------------------------------------------------------
# xAI (Explainability) — used by src/xai/ scripts
# -------------------------------------------------------------
xai:
  enabled: false
  # IMPLEMENTED: 'gradcam_xai' | 'occlusion_xai'
  methode: gradcam_xai
  target_class: null    # null = use the model's own predicted class
  occlusion:
    patch_size: 32      # size of the occluding patch in pixels
    stride: 16          # sliding step size
    batch_size: 32      # occluded versions processed per forward pass

# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
logging:
  use_wandb: false
  project: sep-cvdl-animal-recognition
  run_name: null        # auto-generated from timestamp if null
