version: '3.8'

services:
  dashboard:
    build:
      context: .
      network: host
    container_name: cvdl
    shm_size: '2gb'
    ports:
      - "7860:7860"
    volumes:
      - ../animal_recognition:/app/animal_recognition:ro,z
      - evaluation_cache:/app/cache_data:z
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    restart: unless-stopped

volumes:
  evaluation_cache: